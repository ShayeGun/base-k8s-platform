---
- name: Remove existing export directory
  ansible.builtin.file:
    path: "{{ export_dir }}"
    state: absent

- name: Find downloaded artifact directories
  ansible.builtin.find:
    paths: "{{ download_dir.common }}"
    file_type: directory
  register: download_directories

- name: Create export directory
  ansible.builtin.file:
    path: "{{ export_dir }}"
    state: directory
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0755"

- name: Archive each downloaded artifact directory
  ansible.builtin.archive:
    path: "{{ item.path }}"
    dest: "{{ export_dir }}/{{ item.path | basename }}.tgz"
    format: gz
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0644"
  loop: "{{ download_directories.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Archive project Helm directory
  ansible.builtin.archive:
    path: "{{ playbook_dir | dirname | dirname }}/helm"
    dest: "{{ export_dir }}/helm.tgz"
    format: gz
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0644"
