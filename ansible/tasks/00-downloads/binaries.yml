---
- name: Create binaries download directory
  ansible.builtin.file:
    path: "{{ download_dir.binaries }}"
    state: directory
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0755"

- name: Create systemd unit files download directory
  ansible.builtin.file:
    path: "{{ download_dir.systemd }}"
    state: directory
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0755"

- name: Download binary and package artifacts
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ download_dir.binaries }}/{{ item.value.artifact }}"
    checksum: "{{ item.value.checksum }}"
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    timeout: 3600
    mode: "0644"
  loop: "{{ packages | dict2items }}"
  loop_control:
    label: "Download {{ item.key }}"

- name: Download systemd service unit files
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ download_dir.systemd }}/{{ item.value.artifact }}"
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    timeout: 300
    mode: "0644"
  loop: "{{ services | dict2items }}"
  loop_control:
    label: "Download {{ item.key }} systemd unit"
