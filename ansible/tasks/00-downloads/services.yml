---
- name: Create package directory
  ansible.builtin.file:
    path: "{{ download_dir.sysd_service }}"
    state: directory
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0755"

- name: Create systemd config directory
  ansible.builtin.file:
    path: "{{ download_dir.sysd_config }}"
    state: directory
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0755"

- name: Download services
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ download_dir.sysd_service }}/{{ item.value.artifact }}"
    checksum: "{{ item.value.checksum }}"
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    timeout: 3600
    mode: "0644"
  loop: "{{ packages | dict2items }}"
  loop_control:
    label: "Download {{ item.key }}"

- name: Download systemd services configs
  ansible.builtin.get_url:
    url: "{{ item.value.url }}"
    dest: "{{ download_dir.sysd_config }}/{{ item.value.artifact }}"
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    timeout: 300
    mode: "0644"
  loop: "{{ services | dict2items }}"
  loop_control:
    label: "Download {{ item.key }} systemd config"
