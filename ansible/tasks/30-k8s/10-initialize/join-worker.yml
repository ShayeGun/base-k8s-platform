---
- name: Check if kubelet is already configured
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Join Kubernetes cluster using a temporary bootstrap token
  when: not kubelet_conf.stat.exists
  block:
    - name: Calculate Kubernetes CA public-key hash
      ansible.builtin.shell: |
        set -o pipefail
        openssl x509 -in /etc/kubernetes/pki/ca.crt -pubkey -noout |
          openssl pkey -pubin -outform DER |
          sha256sum |
          awk '{print $1}'
      args:
        executable: /bin/bash
      delegate_to: "{{ groups['initial_manager'][0] }}"
      register: kubeadm_ca_hash_result
      changed_when: false
      run_once: true
      # no_log: true

    - name: Set Kubernetes CA hash fact on the manager host
      ansible.builtin.set_fact:
        kubeadm_ca_hash: "sha256:{{ kubeadm_ca_hash_result.stdout | trim }}"
      delegate_to: "{{ groups['initial_manager'][0] }}"
      delegate_facts: true
      run_once: true
      # no_log: true

    - name: Generate a short-lived bootstrap token
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - create
          - --ttl
          - "{{ cluster.bootstrap_token_ttl }}"
      delegate_to: "{{ groups['initial_manager'][0] }}"
      become: true
      register: bootstrap_token_result
      changed_when: true
      no_log: true

    - name: Create kubeadm config directory
      ansible.builtin.file:
        path: /opt/kubeadm
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Configure kubeadm join
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kubeadm-join-worker.yml.j2"
        dest: /opt/kubeadm/kubeadm-join.yml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Join the worker to Kubernetes
      ansible.builtin.command:
        argv:
          - kubeadm
          - join
          - --config
          - /opt/kubeadm/kubeadm-join.yml
      become: true
      register: join_result
      changed_when: join_result.rc == 0
      no_log: true

    - name: Wait for the worker to register with the Kubernetes API
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - "node/{{ hostvars[inventory_hostname]['ansible_facts']['hostname'] }}"
          - --no-headers
      delegate_to: "{{ groups['initial_manager'][0] }}"
      become: true
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: node_registered_result
      changed_when: false
      retries: 5
      delay: 10
      until: node_registered_result.rc == 0

  always:
    - name: Remove temporary kubeadm join configuration
      ansible.builtin.file:
        path: /opt/kubeadm/kubeadm-join.yml
        state: absent

    - name: Revoke the temporary bootstrap token
      ansible.builtin.command:
        argv:
          - kubeadm
          - token
          - delete
          - "{{ bootstrap_token_result.stdout | trim | split('.') | first }}"
      delegate_to: "{{ groups['initial_manager'][0] }}"
      become: true
      when:
        - bootstrap_token_result is defined
        - bootstrap_token_result.stdout is defined
        - bootstrap_token_result.stdout | trim | length > 0
      changed_when: true
      failed_when: false
      no_log: true

- name: Label node as worker
  ansible.builtin.include_tasks: ../03-utils/label-node.yml
  vars:
    node_label:
      key: node-role.kubernetes.io/worker
      value: ""
