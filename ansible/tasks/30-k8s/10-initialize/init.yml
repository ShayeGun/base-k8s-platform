---
- name: Check if Kubernetes API server manifest exists
  ansible.builtin.stat:
    path: /etc/kubernetes/manifests/kube-apiserver.yaml
  register: kube_apiserver_manifest

- name: Initialize Kubernetes cluster
  when: not kube_apiserver_manifest.stat.exists
  block:
    - name: Create kubeadm configuration directory
      ansible.builtin.file:
        path: /opt/kubeadm
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Render kubeadm init configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/kubeadm-init.yml.j2"
        dest: /opt/kubeadm/kubeadm-config.yml
        owner: root
        group: root
        mode: "0644"

    - name: Initialize Kubernetes control plane
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --config
          - /opt/kubeadm/kubeadm-config.yml

    - name: Configure kubeconfig in user home directory
      ansible.builtin.include_tasks:
        file: ../03-utils/kubeconfig.yml

  always:
    - name: Remove temporary kubeadm init configuration
      ansible.builtin.file:
        path: /opt/kubeadm/kubeadm-config.yml
        state: absent
