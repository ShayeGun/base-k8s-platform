---
- name: Install kubeadm binary
  ansible.builtin.copy:
    src: "{{ download_dir.binaries }}/{{ packages.kubeadm.artifact }}"
    dest: /usr/local/bin/kubeadm
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Create kubelet systemd drop-in directory
  ansible.builtin.file:
    path: /usr/lib/systemd/system/kubelet.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Update kubeadm systemd drop-in ExecStart path
  ansible.builtin.replace:
    path: "{{ download_dir.systemd }}/{{ services.kubeadm.artifact }}"
    regexp: '/usr/bin/kubelet'
    replace: '/usr/local/bin/kubelet'

- name: Install kubeadm kubelet systemd drop-in
  ansible.builtin.copy:
    src: "{{ download_dir.systemd }}/{{ services.kubeadm.artifact }}"
    dest: "{{ services.kubeadm.path }}/{{ services.kubeadm.artifact }}"
    remote_src: true
    owner: root
    group: root
    mode: "0644"

- name: Add kubeadm bash completion
  ansible.builtin.shell:
    cmd: kubeadm completion bash > /etc/bash_completion.d/kubeadm
  args:
    creates: /etc/bash_completion.d/kubeadm
