---
- name: Create Helm config directory
  ansible.builtin.copy:
    dest: "{{ config_dir.common }}"
    src: "{{ download_dir.common }}/helm"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Move Helm chart Contents
  ansible.builtin.copy:
    dest: "{{ config_dir.helm }}"
    src: "{{ download_dir.charts }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"

- name: Create Helm environment directory
  ansible.builtin.file:
    path: "{{ config_dir.helm }}/environments"
    state: directory
    owner: "root"
    group: "root"
    mode: "0755"

- name: Generate Helm global env file
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/helm.yml.j2"
    dest: "{{ config_dir.helm }}/environments/main.yml"
    owner: root
    group: root
    mode: '0644'

- name: Run Helmfile
  ansible.builtin.command:
    argv:
      - helmfile
      - -f
      - "{{ config_dir.helm }}/helmfile.yml"
      - sync
  register: helmfile_result
  changed_when: helmfile_result.rc == 0
