---
- name: Install Cilium CLI binary
  ansible.builtin.unarchive:
    src: "{{ download_dir.binaries }}/{{ packages.cilium_cli.artifact }}"
    dest: /usr/local/bin
    owner: root
    group: root
    mode: "0755"
    remote_src: true

- name: Add Cilium CLI bash completion
  ansible.builtin.shell:
    cmd: cilium completion bash > /etc/bash_completion.d/cilium
  args:
    creates: /etc/bash_completion.d/cilium
