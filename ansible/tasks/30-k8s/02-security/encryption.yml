---
- name: Create encryption configuration directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /var/lib/kubernetes/encryption
    - "{{ cluster.api_server.encryption.dir }}"

- name: Deploy encryption configuration
  ansible.builtin.copy:
    dest: "{{ cluster.api_server.encryption.file }}"
    content: |
      ---
      apiVersion: apiserver.config.k8s.io/v1
      kind: EncryptionConfiguration
      resources:
        - resources:
            - secrets
            #- configmaps
          providers:
            - secretbox:
                keys:
                  - name: k1
                    secret: "{{ api_server_secret }}"
            - identity: {}
        - resources:
            - '*.*'
          providers:
            - identity: {}
    owner: root
    group: root
    mode: "0600"
  no_log: true
