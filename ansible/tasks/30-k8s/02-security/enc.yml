---
- name: Create encryption configuration directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /var/lib/kubernetes/encryption
    - "{{ cluster.api_server.encryption.dir }}"

- name: Deploy encryption configuration
  ansible.builtin.copy:
    dest: "{{ cluster.api_server.encryption.file }}"
    content: |
      ---
      apiVersion: apiserver.config.k8s.io/v1
      kind: EncryptionConfiguration
      resources:
        - resources:
            - secrets
            #- configmaps
          providers:
            - secretbox:
                keys:
                  - name: k1
                    secret: "{{ cluster.api_server.encryption.base64_key }}"
            - identity: {}
        - resources:
            - '*.*'
          providers:
            - identity: {}
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Configure API server encryption
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../templates/kube-apiserver.yml.j2"
    dest: "{{ cluster.api_server.path }}"
    owner: root
    group: root
    mode: "0600"

- name: Wait for Kubernetes API server to become ready
  ansible.builtin.include_tasks:
    file: "../01-utils/apiserver-rediness.yml"

- name: Check whether Secret encryption migration has completed
  ansible.builtin.stat:
    path: /var/lib/kubernetes/encryption/secrets-migration-complete
  register: secrets_migration_marker

- name: Rewrite existing Secrets to apply encryption at rest
  ansible.builtin.shell: |
    set -o pipefail
    kubectl get secrets --all-namespaces -o json |
      kubectl replace -f -
  args:
    executable: /bin/bash
  when: not secrets_migration_marker.stat.exists
  register: secrets_migration
  no_log: true

- name: Mark Secret encryption migration as completed
  ansible.builtin.file:
    path: /var/lib/kubernetes/encryption/secrets-migration-complete
    state: touch
    owner: root
    group: root
    mode: "0600"
  when:
    - not secrets_migration_marker.stat.exists
    - not secrets_migration.failed | default(false)
