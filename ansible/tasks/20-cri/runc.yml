---
- name: Install runc
  ansible.builtin.copy:
    src: "{{ download_dir.sysd_service }}/{{ packages.runc.artifact }}"
    dest: /usr/local/bin/runc
    remote_src: true
    owner: root
    group: root
    mode: '0755'

- name: Install gVisor binaries
  ansible.builtin.unarchive:
    src: "{{ download_dir.sysd_service }}/{{ packages.runsc.artifact }}"
    dest: /usr/local/bin
    remote_src: true
    owner: root
    group: root
    mode: '0755'
