---
- name: Install nerdctl binaries
  ansible.builtin.unarchive:
    src: "{{ download_dir.sysd_service }}/{{ packages.nerdctl.artifact }}"
    dest: /usr/local/bin
    remote_src: true
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: '0755'

- name: Add nerdctl auto-completion
  ansible.builtin.shell:
    cmd: nerdctl completion bash > /etc/bash_completion.d/nerdctl
  args:
    creates: /etc/bash_completion.d/nerdctl
