---
- name: Install nerdctl binary
  ansible.builtin.unarchive:
    src: "{{ download_dir.binaries }}/{{ packages.nerdctl.artifact }}"
    dest: /usr/local/bin
    remote_src: true
    owner: "{{ non_root.user }}"
    group: "{{ non_root.group }}"
    mode: "0755"

- name: Add nerdctl bash completion
  ansible.builtin.shell:
    cmd: nerdctl completion bash > /etc/bash_completion.d/nerdctl
  args:
    creates: /etc/bash_completion.d/nerdctl
