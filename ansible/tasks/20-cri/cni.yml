---
- name: Create CNI plugins directory
  ansible.builtin.file:
    path: /opt/cni/bin
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Extract CNI plugins
  ansible.builtin.unarchive:
    src: "{{ download_dir.binaries }}/{{ packages.cni.artifact }}"
    dest: /opt/cni/bin
    owner: root
    group: root
    mode: "0755"
    remote_src: true
