---
- name: Configure common foundation and runtime on all cluster nodes
  ansible.builtin.import_playbook: playbooks/common.yml

- name: Configure and bootstrap Kubernetes control-plane nodes
  ansible.builtin.import_playbook: playbooks/manager.yml

- name: Configure and join Kubernetes worker nodes
  ansible.builtin.import_playbook: playbooks/worker.yml

- name: Deploy shared platform services with Helmfile
  ansible.builtin.import_playbook: playbooks/platform.yml
