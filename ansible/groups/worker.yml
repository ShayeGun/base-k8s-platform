---
- name: Configure Kubernetes worker nodes
  hosts: workers
  become: true
  gather_facts: true

  vars_files:
    - ../vars/main.yml
    - ../defaults/main.yml

  tasks:
    - name: Load images
      ansible.builtin.include_tasks:
        file: ../tasks/20-cri/images.yml
    - name: Join to cluster
      ansible.builtin.include_tasks:
        file: ../tasks/30-k8s/10-initialize/join-wrk.yml

#######
- name: Configure clusters spesific worker nodes
  hosts: worker1
  become: true
  gather_facts: true

  vars_files:
    - ../vars/main.yml
    - ../defaults/main.yml

  tasks:
    - name: Label worker node as storage
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../tasks/30-k8s/01-utils/label-node.yml"
      vars:
        node_label:
          key: "{{ volume_provisioner.label.key }}"
          value: "{{ volume_provisioner.label.value }}"

    - name: Create storage node data path
      ansible.builtin.file:
        path: "{{ volume_provisioner.data_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
