---
helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 180

releases:
  - name: cilium
    namespace: kube-system
    chart: ../charts/cilium-1.20.2.tgz
    values:
      - ../values/networking/cilium.gotmpl

  - name: istio-base
    namespace: istio-system
    chart: ../charts/istio-base-1.31.3.tgz
    needs:
      - kube-system/cilium

  - name: istiod
    namespace: istio-system
    chart: ../charts/istiod-1.31.3.tgz
    values:
      - ../values/networking/istiod.yaml
      - profile: ambient
    needs:
      - istio-system/istio-base

  - name: istio-cni
    namespace: istio-system
    chart: ../charts/istio-cni-1.31.3.tgz
    values:
      - profile: ambient
    needs:
      - istio-system/istiod

  - name: ztunnel
    namespace: istio-system
    chart: ../charts/ztunnel-1.31.3.tgz
    values:
      - _internal_defaults_do_not_set:
          variant: distroless
    needs:
      - istio-system/istio-cni
