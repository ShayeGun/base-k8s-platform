---
helmDefaults:
  wait: true
  waitForJobs: true
  timeout: 180

releases:
  - name: axosyslog
    namespace: axosyslog
    chart: ../charts/axosyslog-0.22.0.tgz
    values:
      - ../values/observability/axosyslog.yaml

  - name: fluentbit
    namespace: fluent
    chart: ../charts/fluentbit-1.1.3.tgz
    values:
      - ../values/observability/fluentbit.gotmpl
    needs:
      - axosyslog/axosyslog

  - name: falcosidekick
    namespace: falco
    chart: ../charts/falcosidekick-0.14.2.tgz
    values:
      - ../values/observability/falcosidekick.gotmpl
    needs:
      - axosyslog/axosyslog

  - name: falco
    namespace: falco
    chart: ../charts/falco-9.2.2.tgz
    values:
      - ../values/observability/falco.yaml
    set:
      - name: customRules.falco_rules\.yaml
        file: ../values/observability/falco-rules.yaml
    needs:
      - falco/falcosidekick
