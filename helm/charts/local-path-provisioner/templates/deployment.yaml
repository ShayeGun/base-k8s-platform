apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}

      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}

      containers:
        - name: local-path-provisioner
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - local-path-provisioner
            {{- if .Values.provisioner.debug }}
            - --debug
            {{- end }}
            - start
            - --config
            - {{ .Values.provisioner.configMountPath }}config.json

          volumeMounts:
            - name: config-volume
              mountPath: {{ .Values.provisioner.configMountPath }}

          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: CONFIG_MOUNT_PATH
              value: {{ .Values.provisioner.configMountPath | quote }}

      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
